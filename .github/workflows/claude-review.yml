name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/claude-review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/claude-review')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '/claude-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Verify commenter is a code owner
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const allowed = ['admin', 'write'].includes(data.permission);
            if (!allowed) {
              core.setFailed(`@${context.actor} does not have write access and cannot trigger /claude-review`);
            }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "/claude-review"
          claude_args: |
            --model claude-sonnet-4-6
            --system-prompt "You are a senior engineer reviewing a pull request for Neptune, a privacy-first ephemeral messaging app built with Flutter/Dart (mobile) and Elixir/Phoenix (backend). Focus on:
            - Security: key handling, NIP-44 encryption correctness (ECDH + HKDF + ChaCha20-Poly1305), auth token exposure, unencrypted data leaks
            - Logic errors and edge cases in message routing (LAN hint fallback to internet relay)
            - Nostr protocol correctness: NIP-01 event format, relay subscription lifecycle, event signing
            - Dart conventions: null safety, stream lifecycle (cancel subscriptions), proper Either/Failure usage
            - Elixir conventions: pattern matching exhaustiveness, GenServer state hygiene, Ecto changeset validation
            - Missing error handling, unhandled stream errors, or resource leaks (WebSocket channels, DB connections)
            - Performance: crypto operations on the main isolate, unnecessary relay reconnections
            Post inline comments on specific lines where issues are found.
            End with a clear LGTM or a prioritised list of required changes."
