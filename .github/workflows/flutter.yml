name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "neptune_app/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    branches: [main]
    paths:
      - "neptune_app/**"
      - ".github/workflows/flutter.yml"

defaults:
  run:
    working-directory: neptune_app

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings lib/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter=github
